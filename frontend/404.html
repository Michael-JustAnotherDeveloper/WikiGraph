<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
        }
        h1 {
            font-size: 6rem;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 1rem;
            color: #ffffff;
        }
        p {
            font-size: 1.125rem;
            color: #a0a0a0;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        a {
            display: inline-block;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #121212;
            background-color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            transition: opacity 0.2s ease;
        }
        a:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Страница, которую вы ищете, не существует или была перемещена.</p>
        <a href="/">На главную</a>
    </div>
</body>
</html>
