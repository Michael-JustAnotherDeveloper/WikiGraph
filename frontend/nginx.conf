server {
    listen 80;
    server_name localhost;

    location / {
        root /var/www/react-app/dist;
        index index.html;
    }

    location /search {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /graph {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /page {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-real-Ip $remote_addr;
    }
    location /backlist {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-real-Ip $remote_addr;
    }
    location /random {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-real-Ip $remote_addr;
    }
}

