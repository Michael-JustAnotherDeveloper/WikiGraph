services:
  frontend:
    build: ./frontend
    container_name: frontend

    ports:
      - 80:80
    
    env_file:
      - .env
    
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: backend

    env_file:
      - .env

    expose:
      - 8080

    depends_on:
      elastic_db:
        condition: service_healthy
      graph_db:
        condition: service_healthy

  elastic_db:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elastic
    environment:
      xpack.security.enabled: "false"
      discovery.type: single-node
      #ES_JAVA_OPTS: -Xms512m -Xmx512m
    
    #ports:
      #- 9200:9200
      #- 9300:9300
    
    #volumes:
     #- elastic-data:/usr/share/elasticsearch/data
    
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]   # != red
      interval: 10s
      timeout: 10s
      retries: 5
  
  graph_db:
    image: neo4j:5.22
    container_name: graph
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}

    #ports:
      #- 7474:7474
      #- 7687:7687
    healthcheck:
      test: ["CMD-SHELL", "wget -qo- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    #volumes:
      #- $HOME/neo4j/data:/data
  
#volumes:
  #elastic-data:
